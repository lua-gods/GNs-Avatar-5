local Sequencer = require("lib.sequencer")


local rightClick = keybinds:fromVanilla("key.use")
local resetKey = keybinds:fromVanilla("key.sneak")


local pos = {
	vec(-197.74042, 63, 228.3),
	vec(-197.74042, 256, 228.3),
	vec(-669, 256, 228.3),
}


local function setPos(x,y,z)
---@diagnostic disable-next-line: param-type-mismatch
	silly:setPos(x,y,z)
	silly:setVelocity(0,0,0)
end

if true then
	rightClick.press = function (modifiers, self)
		Sequencer.new()
		:add(10,function () setPos(pos[1]) end)
		:add(20,function () setPos(pos[2]) end)
		:add(30,function () setPos(pos[3]) end)
		:start(events.WORLD_TICK)
	end
	
	resetKey.press = function (modifiers, self)
		Sequencer.new()
		:add(1,function () setPos(pos[3]) end)
		:add(5,function () setPos(pos[2]) end)
		:add(10,function () setPos(pos[1]) end)
		:start(events.WORLD_TICK)
	end
else
	events.WORLD_TICK:register(function ()
	local pos = player:getPos()
	silly:setPos(-674.96,pos.y,pos.z)
end)
end