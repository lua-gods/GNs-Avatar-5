local modelUtils = require("lib.modelUtils")

---@class pointMass
---@field lpos Vector3
---@field pos Vector3
---@field target Vector3


local function matrixRotateAroundAxis(mat, axis, angle)
	local mat2 = matrices.mat4()
	mat2.c1 = vectors.rotateAroundAxis(angle, mat.c1.xyz:normalize(), axis):augmented(0)
	mat2.c2 = vectors.rotateAroundAxis(angle, mat.c2.xyz:normalize(), axis):augmented(0)
	mat2.c3 = vectors.rotateAroundAxis(angle, mat.c3.xyz:normalize(), axis):augmented(0)
	mat2.c4 = mat.c4
	return mat2
end


local function angleBetweenUnit(a, b)
	local cosTheta = math.clamp(a:dot(b), -1, 1)
	return math.deg(math.acos(cosTheta))
end





local function simulate(MODEL)
MODEL:setParentType("WORLD")
---@type pointMass[]
local points = {}

local stateMat = matrices.mat4()

local t = 0
events.TICK:register(function()
	t = t + 1

	local mat = MODEL:partToWorldMatrix()
	
	if t == 4 then
		local center = vec(0,0,0)
		local c = 0
		for key, vertexGroup in pairs(MODEL:getAllVertices()) do
			for index, vertex in ipairs(vertexGroup) do
				center = center + vertex:getPos()
				c = c + 1
			end
		end
		center = center / c
		
		for key, vertexGroup in pairs(MODEL:getAllVertices()) do
			for index, vertex in ipairs(vertexGroup) do
				vertex:setPos(vertex:getPos()-center)
				local gpos = mat:apply(vertex:getPos()-center)
				points[#points + 1] = {
					lpos = gpos,
					pos = gpos,
					target = vertex:getPos()-center,
				}
			end
		end
	end
	
	local averageCenter = vec(0, 0, 0)
	local center = mat:apply(0, 0, 0)
	for index, pm in ipairs(points) do
		local gpos = mat:apply(pm.target)
		particles["end_rod"]:pos(pm.pos):lifetime(0):scale(0.1):spawn()
		
		
		pm.lpos = pm.pos:copy()
		
		-- vercel integration
		pm.pos = pm.pos + (pm.pos - pm.lpos)
		
		pm.pos = gpos
		
		pm.pos = pm.pos + vec(0,-0.1,0)
		
		if world.getBlockState(pm.pos + vec(0,0.01,0)).id ~= "minecraft:air" then
			pm.pos = vec(pm.pos.x,math.floor(pm.pos.y)+1.1,pm.pos.z)
		end
		averageCenter = averageCenter + pm.pos

		-- attempt to align matrix with the pointMass
		local pos = pm.pos

		local diff1 = (pos - gpos)
		local diff2 = (center - gpos)
		
		if diff1:lengthSquared() > 0.01 and diff2:lengthSquared() > 0.01 then
			local axis = diff1:cross(diff2):normalize()
	
			stateMat = matrixRotateAroundAxis(
				stateMat,
				axis,
				angleBetweenUnit(
					(center - pos):normalize(),
					(center - gpos):normalize()
				) / #points
			)
		end

	end
	if #points > 0 then
		averageCenter = (averageCenter / #points) * 0.1

		stateMat.c4 = (averageCenter * 16):augmented(1)

		MODEL:setMatrix(stateMat)
	end
end)

end

modelUtils.apply(models.player,function (modelPart)
	if not modelPart:getVisible() then return true end
	if modelPart:getType() ~= "GROUP" then
		simulate(modelPart)
	end
end)