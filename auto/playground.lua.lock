-- amount of bytes per batch
local CHUNK_SIZE = 4096
local IDENTIFIER = "e"

local sync = require("lib.sync")

if host:isHost() then
	local audio = file:openReadStream("ascent.ogg")

	local buffer = data:createBuffer(audio:available())
	buffer:readFromStream(audio)
	buffer:setPosition(0)

	local length = buffer:available()
	local size = length
	local i = 0

	local t = 0
	events.TICK:register(function()
		t = t + 1
		if t > 20 then
			while length > 0 do
				length = buffer:available()
				i = i + 1
				sync[IDENTIFIER .. i] = buffer:readBase64(CHUNK_SIZE)
			end
			events.TICK:remove("sender")
		end
	end,"sender")

	local estimatedSize = (math.ceil(size / CHUNK_SIZE) + 1)
	sync.chunkCount = estimatedSize
end

events.TICK:register(function()
	if sync.chunkCount then
		local progress = 0
		for i = 1, sync.chunkCount, 1 do
			if sync[IDENTIFIER .. i] then
				progress = progress + 1
			end
		end
		local percent = progress / sync.chunkCount * 100
		nameplate.ALL:setText("Progress: " .. percent .. "%")
		if percent == 100 then
			local compileBuffer = data:createBuffer(sync.chunkCount * CHUNK_SIZE)
			for i = 1, sync.chunkCount, 1 do
				compileBuffer:writeBase64(sync[IDENTIFIER .. i])
			end
			compileBuffer:setPosition(0)
			local data = compileBuffer:readBase64(compileBuffer:available())

			sounds:newSound(IDENTIFIER, data)

			local audio = sounds[IDENTIFIER]:play()

			events.TICK:register(function ()
				audio:pos(player:getPos())
			end)
			
			events.TICK:remove("waiter")
		end
	end
end, "waiter")
