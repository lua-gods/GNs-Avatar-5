local sm = require("lib.statusManager")

local emote = animations["models.player"].FallOverSolid

emote
:setBlendDuration(0.5)

sm.STATUS_CHANGED:register(function (state)
	if state == 1 then
		emote:stop():speed(1):play()
		:setLoop("HOLD")
	elseif state == 0 then
		emote:stop():speed(-1):play()
		:setLoop("ONCE")
	end
end)