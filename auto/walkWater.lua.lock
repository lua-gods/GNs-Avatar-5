# flags: host_only

local jump = keybinds:fromVanilla("key.jump")

events.WORLD_TICK:register(function ()
	if player:isLoaded() then
		if player:isWet() then
			local vel = vec(table.unpack(player:getNbt().Motion))
			local pos = player:getPos()
			host:setVelocity(vel.x_z)
			host:setPos(pos.x,math.ceil(pos.y)-0.1,pos.z)
			if jump:isPressed() then
				host:setVelocity(vel.x_z:mul(1.3,0,1.3):add(0,0.4,0))
			end
		end
	end
end)